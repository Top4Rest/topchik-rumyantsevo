name: Sync menu from Google Sheets

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-menu
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CSVs from Google Sheets
        run: |
          mkdir -p data
          URL_MENU="ВСТАВЬ_ССЫЛКУ_ЛИСТА_МЕНЮ"
          URL_KOMPLEKS="ВСТАВЬ_ССЫЛКУ_ЛИСТА_БИЗНЕС-ЛАНЧ"
          URL_SOSTAV="ВСТАВЬ_ССЫЛКУ_ЛИСТА_СОСТАВЫ"
          dl () {
            case "$1" in
              https://*)
                if curl -sSL --fail --retry 3 --retry-delay 5 "$1" -o "$2.tmp" && [ -s "$2.tmp" ]; then
                  mv "$2.tmp" "$2"; echo "обновлён $2"
                else
                  rm -f "$2.tmp"; echo "::warning::пустой/ошибка для $2 — оставляю файл из репозитория"
                fi ;;
              *) echo "ссылка не задана для $2 — использую файл из репозитория" ;;
            esac
          }
          dl "$URL_MENU"     data/menu.csv
          dl "$URL_KOMPLEKS" data/kompleks.csv
          dl "$URL_SOSTAV"   data/sostav.csv

      - name: Commit if changed
        run: |
          git config user.name  "menu-sync-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/menu.csv data/kompleks.csv data/sostav.csv
          if git diff --staged --quiet; then
            echo "Изменений нет — коммит не нужен."
          else
            git commit -m "Sync menu data from Google Sheets"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
