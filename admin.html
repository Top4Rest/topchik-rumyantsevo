<title>Конструктор меню ТОПЧИК</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#E7DDCA; --panel:#F6F1E7; --panel-2:#FFFDF8; --raised:#FBF6EC;
  --ink:#2C2620; --ink-soft:#8A7C63; --muted:#A99A80;
  --line:#D8CDB8; --frame:#C4B594;
  --olive:#5C6440; --olive-deep:#474E31; --rust:#A8451C; --rust-soft:#B9633A; --gold:#A07C36;
  --ok:#5C6440;
  --f-display:"Playfair Display",Georgia,serif;
  --f-body:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 1px 2px rgba(44,38,32,.06),0 6px 20px rgba(44,38,32,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;
  -webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--olive);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── Шапка ── */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;
  padding:11px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:9px}
.brand .wm{font-family:var(--f-display);font-weight:800;letter-spacing:.04em;font-size:20px}
.brand .sub{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}
.tabs{display:flex;gap:4px;margin-left:6px}
.tab{padding:7px 13px;border-radius:999px;border:1px solid transparent;background:transparent;
  color:var(--ink-soft);font-size:13px;font-weight:500}
.tab.active{background:var(--olive-deep);color:var(--panel);border-color:var(--olive-deep)}
.tab.disabled{opacity:.45;pointer-events:none}
.tab .soon{font-size:9px;color:var(--muted);margin-left:5px}
.spacer{flex:1}
.loc{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft)}
.loc select{font-family:inherit;font-size:13px;color:var(--ink);background:var(--panel-2);
  border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.btn{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:9px;
  padding:8px 14px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--frame)}
.btn.primary{background:var(--olive);border-color:var(--olive);color:#F6F1E7}
.btn.primary:hover{background:var(--olive-deep)}
.badge-proto{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--rust);
  border:1px solid var(--rust-soft);border-radius:6px;padding:3px 7px;background:rgba(168,69,28,.06)}

/* ── Раскладка ── */
.layout{display:grid;grid-template-columns:300px minmax(300px,1fr) 448px;gap:0;
  height:calc(100vh - 57px);min-height:0}
.col{min-height:0;overflow:auto;padding:18px}
.col.sidebar{background:var(--panel);border-right:1px solid var(--line)}
.col.editor{background:var(--bg)}
.col.preview{background:var(--panel);border-left:1px solid var(--line);padding:0}
.col-title{font-family:var(--f-display);font-weight:600;font-size:15px;margin:2px 0 14px;
  display:flex;align-items:center;justify-content:space-between}
.col-title .count{font-family:var(--f-body);font-size:11px;color:var(--ink-soft);font-weight:500}

/* ── Список блюд ── */
.tabfilter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);
  color:var(--ink-soft);font-size:12px;font-weight:500}
.chip.active{background:var(--panel-2);border-color:var(--olive);color:var(--olive-deep);box-shadow:inset 0 0 0 1px var(--olive)}
.sec-h{font-family:var(--f-display);font-size:12px;font-weight:600;color:var(--olive-deep);
  text-transform:uppercase;letter-spacing:.05em;margin:16px 2px 7px}
.item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;
  border:1px solid transparent;background:transparent;width:100%;text-align:left;cursor:grab}
.item:active{cursor:grabbing}
.item.dragging{opacity:.5;box-shadow:var(--shadow);background:var(--panel-2)}
.item.dropafter{box-shadow:0 2px 0 var(--olive)}
.grip{flex:none;display:inline-flex;color:var(--muted);opacity:0;transition:opacity .12s;margin-left:-3px;cursor:grab}
.item:hover .grip,.item.sel .grip{opacity:.85}
@media (hover:none){.grip{opacity:.85}}
.item:hover{background:var(--raised)}
.item.sel{background:var(--panel-2);border-color:var(--frame);box-shadow:var(--shadow)}
.item .st{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.item.off .st{background:var(--muted)}
.item .nm{flex:1;min-width:0;font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.off .nm{color:var(--muted);text-decoration:line-through}
.item .pr{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;flex:none}
.item .del{flex:none;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
  border-radius:7px;color:var(--muted);opacity:0;transition:opacity .12s,color .12s,background .12s;margin:-4px -4px -4px 0}
.item:hover .del,.item.sel .del{opacity:1}
.item .del:hover{color:var(--rust);background:rgba(168,69,28,.09)}
@media (hover:none){.item .del{opacity:1}}
.additem{margin-top:12px;width:100%;justify-content:center;border-style:dashed}

/* ── Форма ── */
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);max-width:640px}
.form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:15px}
.form-2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
label.fl{font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--ink-soft);text-transform:uppercase}
.hint{font-size:11px;color:var(--muted)}
.sug{position:absolute;top:100%;left:0;right:0;z-index:30;margin-top:4px;background:var(--panel-2);
  border:1px solid var(--frame);border-radius:10px;box-shadow:var(--shadow);max-height:230px;overflow:auto}
.sug div{padding:9px 12px;font-size:14px;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug div:last-child{border-bottom:0}
.sug div:hover,.sug div.active{background:var(--olive-deep);color:#F6F1E7}
input[type=text],input[type=password],textarea,select{font-family:inherit;font-size:14px;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
input[type=text]:focus,input[type=password]:focus,textarea:focus,select:focus{border-color:var(--olive);outline:none;box-shadow:0 0 0 3px rgba(92,100,64,.12)}
textarea{resize:vertical;min-height:64px;line-height:1.5}
.marks{display:flex;flex-wrap:wrap;gap:8px}
.mkbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--ink-soft)}
.mkbtn.on{border-color:var(--olive);color:var(--olive-deep);background:rgba(92,100,64,.07)}
.mkbtn .d{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.75}
.toolbar{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.toolbar .grow{flex:1}
.btn.ghost{background:transparent}
.btn.danger{color:var(--rust);border-color:transparent}
.btn.danger:hover{border-color:var(--rust-soft);background:rgba(168,69,28,.05)}
.switch{display:inline-flex;align-items:center;gap:9px;font-size:13px;color:var(--ink)}
.tgl{position:relative;width:42px;height:24px;border-radius:999px;background:var(--frame);border:none;transition:background .15s}
.tgl.on{background:var(--olive)}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#FBF6EC;transition:left .15s}
.tgl.on::after{left:21px}
.empty{color:var(--ink-soft);font-size:14px;text-align:center;padding:50px 20px;max-width:360px;margin:0 auto;line-height:1.6}

/* ── Предпросмотр ── */
.pv-head{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);
  padding:14px 18px;display:flex;align-items:center;justify-content:space-between;z-index:2}
.pv-head .t{font-family:var(--f-display);font-weight:600;font-size:15px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:none;background:transparent;padding:6px 12px;border-radius:7px;font-size:12px;color:var(--ink-soft);font-weight:500}
.seg button.on{background:var(--panel-2);color:var(--ink);box-shadow:var(--shadow)}
.pv-stage{padding:22px 18px 40px;display:block;text-align:center;overflow-x:auto;background:
  repeating-linear-gradient(45deg,#E1D6C1 0 2px,transparent 2px 12px),var(--bg)}
.device{display:inline-block;text-align:left;vertical-align:top;background:var(--panel);border:1px solid var(--frame);border-radius:18px;box-shadow:var(--shadow);
  padding:20px 18px;transition:width .18s}
.device.phone{width:380px}
.device.desk{width:840px;border-radius:14px}

/* ── Движок сайта (scoped .tp) — 1:1 с index.html ── */
.tp{--paper:#F6F1E7;--paper-2:#EFE7D6;--ink:#2C2620;--ink-soft:#91836E;--olive:#5C6440;--olive-deep:#474E31;--frame:#C4B594;
  --rust:#A8451C;--gold:#A07C36;--line:#D8CDB8;--f-display:"Playfair Display",Georgia,serif;--f-body:"Inter",sans-serif;
  color:var(--ink);font-family:var(--f-body)}
.tp .tp-tabname{font-family:var(--f-display);font-weight:700;font-size:26px;text-align:center;color:var(--ink);margin:2px 0 4px}
.tp .tp-orn{display:flex;align-items:center;justify-content:center;gap:9px;margin:0 0 18px}
.tp .tp-orn .d{width:5px;height:5px;border-radius:50%;background:var(--rust)}
.tp .tp-orn .l{width:38px;height:1px;background:var(--frame,#C4B594)}
.tp .category{margin-bottom:26px}
.tp .category-header{display:flex;align-items:baseline;gap:14px;margin-bottom:13px}
.tp .category-title{font-family:var(--f-display);font-weight:600;color:var(--accent,var(--olive-deep));font-size:21px;white-space:nowrap}
.tp .category-line{flex:1;height:1px;background:var(--line)}
.tp .menu-items{display:flex;flex-direction:column}
.tp .menu-item{padding:11px 0;border-bottom:1px dotted var(--line)}
.tp .menu-item:last-child{border-bottom:0}
.tp .dish-row{display:flex;align-items:baseline;gap:10px}
.tp .dish-title{font-family:var(--f-display);font-size:19px;font-weight:500;color:var(--ink);line-height:1.25;flex:1;min-width:0;overflow-wrap:break-word}
.tp .dish-title.tap{cursor:pointer}
.tp .dish-title.tap .i{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:7px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);font-family:var(--f-body);font-size:9px;font-weight:600;font-style:normal;vertical-align:middle;transform:translateY(-2px)}
.tp .dish-vol{font-size:12px;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.tp .dish-price{font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums;margin-left:auto}
.tp .dish-name2{font-family:var(--f-display);font-size:15px;font-style:italic;color:var(--ink-soft);margin-top:1px}
.tp .dish-desc{font-size:12.5px;color:var(--ink-soft);margin-top:4px;line-height:1.5;max-width:54ch}
.tp .pill-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));column-gap:30px}
.tp .pill{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px dotted var(--line);font-size:14px;color:var(--ink)}
.tp .pill-name{flex:1;min-width:0}
.tp .pill-name::before{content:"+";color:var(--ink-soft);margin-right:6px;font-weight:500}
.tp .pill-price{font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.tp .mk{display:inline-block;width:15px;height:15px;margin-left:5px;vertical-align:-2px}
.tp .mk svg{display:block;width:100%;height:100%}
.tp .mk-veg{color:#7FA05A}.tp .mk-hot{color:var(--rust)}.tp .mk-hit{color:var(--gold)}
.tp .mk-new-badge{display:inline-block;margin-left:6px;vertical-align:1px;font-family:var(--f-body);font-size:9px;font-weight:700;letter-spacing:.05em;color:var(--paper);background:var(--gold);border-radius:5px;padding:1px 5px;line-height:1.35}
.tp.two .tp-cols{column-count:2;column-gap:44px}
.tp.two .category{break-inside:avoid}

/* Бизнес-ланч в предпросмотре (1:1 с сайтом) */
.tp .kompleks-price{display:flex;align-items:center;justify-content:space-between;background:var(--olive-deep);color:var(--paper);border-radius:14px;padding:16px 20px;margin-bottom:8px}
.tp .kompleks-price-label{font-size:13px;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.tp .kompleks-date{display:block;font-size:11px;letter-spacing:.06em;text-transform:none;opacity:.8;margin-top:3px}
.tp .kompleks-price-value{font-family:var(--f-display);font-size:26px;font-weight:600}
.tp .kompleks-note{text-align:center;font-size:12px;color:var(--ink-soft);margin:0 0 22px}
.tp .kompleks-note span{color:var(--rust)}
.tp .choice-grid{display:grid;grid-template-columns:1fr;gap:9px}
.tp.two .choice-grid{grid-template-columns:1fr 1fr}
.tp .choice-card{position:relative;background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:13px 36px 13px 15px}
.tp .choice-name{font-family:var(--f-display);font-size:18px;color:var(--ink);line-height:1.25}
.tp .choice-footnote{font-size:11.5px;color:var(--ink-soft);margin-top:5px;line-height:1.45}
.tp .choice-price{font-size:13px;font-weight:600;color:var(--olive-deep);margin-top:7px}
.tp .kbzhu-btn{position:absolute;top:10px;right:12px;width:18px;height:18px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);font-style:normal;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--paper)}

/* Редактор бизнес-ланча */
.bl-price{display:flex;align-items:center;gap:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.bl-price input{width:96px}
.bl-days{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.bl-days .chip{display:inline-flex;align-items:center}
.bl-copy{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px;font-size:12px;color:var(--ink-soft)}
.bl-copy select{width:auto;font-size:12px;padding:6px 8px}
.bl-cat{margin-bottom:22px}
.bl-cat-h{font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--gold);margin:0 0 10px}
.bl-opt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px}
.bl-opt .r{display:grid;grid-template-columns:1fr 108px;gap:10px}
.bl-opt textarea{min-height:38px}
.bl-opt .foot{display:flex;align-items:center;gap:10px;margin-top:10px}
.bl-addopt{border-style:dashed;width:100%;justify-content:center;margin-top:2px}
.today-dot{width:6px;height:6px;border-radius:50%;background:var(--rust);display:inline-block;margin-left:6px}

/* Составы */
.item.so{cursor:pointer}
.so-search{margin-bottom:12px}
.so-badge{flex:none;width:8px;height:8px;border-radius:50%}
.so-ok{background:var(--olive)}
.so-warn{background:var(--gold)}
.so-conn{font-size:12px;border-radius:9px;padding:9px 11px;margin:2px 0 15px;line-height:1.45}
.so-conn.ok{color:var(--olive-deep);background:rgba(92,100,64,.08)}
.so-conn.warn{color:var(--rust);background:rgba(168,69,28,.07)}
.so-miss{font-size:11.5px;color:var(--ink-soft);margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.form-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.form-4 input{text-align:center;font-variant-numeric:tabular-nums}

/* модалка КБЖУ (как на сайте) */
.kbov{position:fixed;inset:0;background:rgba(44,38,32,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.kbov.show{display:flex}
.kbcard{background:var(--panel-2);border:1px solid var(--frame);border-radius:16px;max-width:360px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(44,38,32,.3)}
.kbcard h3{font-family:var(--f-display);font-weight:600;font-size:21px;margin:0 0 4px;color:var(--ink)}
.kbcard .sost{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 16px}
.kbstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kbstat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 6px;text-align:center}
.kbstat b{display:block;font-family:var(--f-display);font-weight:600;font-size:19px;color:var(--olive-deep);font-variant-numeric:tabular-nums;line-height:1.1}
.kbstat span{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.kbclose{margin-top:18px;width:100%;justify-content:center}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--olive-deep);color:#F6F1E7;padding:12px 20px;border-radius:11px;font-size:13.5px;
  box-shadow:0 10px 30px rgba(44,38,32,.25);opacity:0;pointer-events:none;transition:.22s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Вход */
.who{font-size:12px;color:var(--ink-soft);white-space:nowrap;font-weight:600}
.authov{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:var(--bg);padding:20px}
.authov.show{display:flex}
.authcard{width:100%;max-width:340px;background:var(--panel-2);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow)}
.authbrand{display:flex;align-items:baseline;gap:8px;margin-bottom:18px}
.authbrand .wm{font-family:var(--f-display);font-weight:800;letter-spacing:.04em;font-size:22px}
.authbrand .sub{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.authttl{font-family:var(--f-display);font-size:18px;font-weight:600;margin-bottom:16px}
.authcard label.fl{display:block;margin-bottom:6px}
.autherr{color:var(--rust);font-size:12.5px;min-height:16px;margin-top:10px}

@media (max-width:1080px){
  .layout{grid-template-columns:1fr;height:auto}
  .col{height:auto;overflow:visible}
  .col.preview{border-left:none;border-top:1px solid var(--line)}
  .tabs{display:none}
}
</style>

<div class="topbar">
  <div class="brand"><span class="wm">ТОПЧИК</span><span class="sub">Конструктор&nbsp;меню</span></div>
  <div class="tabs">
    <button class="tab active" data-mode="menu">Меню</button>
    <button class="tab" data-mode="bl">Бизнес-ланч</button>
    <button class="tab" data-mode="so">Составы</button>
  </div>
  <div class="spacer"></div>
  <span class="who" id="who"></span>
  <button class="btn ghost" id="btnPub" title="Сохранить и обновить сайт">Опубликовать</button>
  <button class="btn primary" id="btnSave">Сохранить</button>
  <button class="btn ghost" id="btnLogout" title="Выйти из кабинета">Выйти</button>
</div>

<div class="layout">
  <!-- Список -->
  <div class="col sidebar">
    <div id="menuSide">
      <div class="col-title">Блюда <span class="count" id="cnt"></span></div>
      <div class="tabfilter" id="tabfilter"></div>
      <div id="list"></div>
      <button class="btn additem" id="btnAdd">+ Добавить блюдо</button>
    </div>
    <div id="blSide" hidden></div>
    <div id="soSide" hidden></div>
  </div>

  <!-- Форма -->
  <div class="col editor">
    <div id="menuEdit">
      <div class="col-title">Карточка блюда</div>
      <div id="formWrap"></div>
    </div>
    <div id="blEdit" hidden></div>

function markIcons(tags){
  const t=(tags||'').toLowerCase();let out='';

function renderMenuItem(it){

  const price=it.price?`<span class="dish-price">${_esc(it.price)} ₽</span>`:'';
  const metaBits=[];if(it.name2)metaBits.push(_esc(it.name2));if(it.vol&&longVol)metaBits.push(_esc(it.vol));
  const name2=metaBits.length?`<div class="dish-name2">${metaBits.join(' · ')}</div>`:'';
  const desc=it.desc?`<div class="dish-desc">${_esc(it.desc)}</div>`:'';

  return `<div class="menu-item"><div class="dish-row"><span${tap}>${_esc(name)}${marks}${iB}</span>${vol}${price}</div>${name2}${desc}</div>`;
}
function buildSection(title,items){
  const isPills=items.length&&items.every(x=>x.type==='pill');

  return `<div class="category"><div class="category-header"><span class="category-title">${_esc(title)}</span><div class="category-line"></div></div>${wrap}</div>`;
}

let SOST;
function sostLoad(){try{const s=localStorage.getItem('tp_sost');SOST=s?JSON.parse(s):structuredClone(sostSeed);}catch(e){SOST=structuredClone(sostSeed);}}

const norm=s=>String(s==null?'':s).trim().toLowerCase();
const fz=s=>norm(s).replace(/[ёэ]/g,'е').replace(/[^0-9a-zа-я]/g,'');
function subDist(q,t){const m=q.length,n=t.length;if(!m)return 0;if(!n)return m;
  let prev=new Array(n+1).fill(0),cur=new Array(n+1);
  for(let i=1;i<=m;i++){cur[0]=i;for(let j=1;j<=n;j++){const c=q[i-1]===t[j-1]?0:1;
    cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+c);}const t2=prev;prev=cur;cur=t2;}
  return Math.min.apply(null,prev);}
function sostByName(name){return SOST.find(x=>norm(x.name)===norm(name));}
function kbzhuOf(name){const e=sostByName(name);if(!e)return null;const a=[e.kcal,e.prot,e.fat,e.carb];return a.some(v=>v!==''&&v!=null)?a:null;}

let items,selId,curTab=TABS[0],device='phone';

load();
selId=(items.find(x=>x.tab===curTab)||items[0]||{}).id;

const $=s=>document.querySelector(s);
function sel(){return items.find(x=>x.id===selId);}
function tabItems(t){return items.filter(x=>x.tab===t);}
function sectionsOf(t){const o=[];tabItems(t).forEach(x=>{if(!o.includes(x.section))o.push(x.section);});return o;}

function renderTabs(){
  $('#tabfilter').innerHTML=TABS.map(t=>`<button class="chip ${t===curTab?'active':''}" data-t="${_esc(t)}">${_esc(t)} <span style="opacity:.6">${tabItems(t).length}</span></button>`).join('');
}

  const secs=sectionsOf(curTab);

    h+=`<div class="sec-h">${_esc(sc)}</div>`;

  $('#list').innerHTML=h||'<div class="hint" style="padding:10px 2px">В этой категории пока нет блюд.</div>';
  $('#cnt').textContent=items.length+' всего';
}
function field(label,key,opts={}){
  const v=_esc(sel()[key]);
  if(opts.type==='textarea')return `<div class="form-row"><label class="fl">${label}</label><textarea data-k="${key}" placeholder="${opts.ph||''}">${v}</textarea>${opts.hint?`<span class="hint">${opts.hint}</span>`:''}</div>`;
  if(opts.type==='select'){const o=opts.options.map(x=>`<option ${x===sel()[key]?'selected':''}>${_esc(x)}</option>`).join('');
    return `<div class="form-row"><label class="fl">${label}</label><select data-k="${key}">${o}</select></div>`;}
  return `<div class="form-row"><label class="fl">${label}</label><input type="text" data-k="${key}" value="${v}" placeholder="${opts.ph||''}" ${opts.list?`list="${opts.list}"`:''}>${opts.hint?`<span class="hint">${opts.hint}</span>`:''}</div>`;
}
function renderForm(){
  const it=sel();
  if(!it){$('#formWrap').innerHTML='<div class="empty">Выберите блюдо слева или добавьте новое.</div>';return;}
  const secDatalist=`<datalist id="secs">${sectionsOf(curTab).map(s=>`<option value="${_esc(s)}">`).join('')}</datalist>`;
  const marks=MARKS.map(([k,lbl,c])=>{
    const on=new RegExp('(^|\\s)'+k).test(it.tags||'');
    return `<button class="mkbtn ${on?'on':''}" data-mk="${k}" style="${on?'--c:'+c:''}"><span class="d" style="background:${c}"></span>${lbl}</button>`;
  }).join('');
  $('#formWrap').innerHTML=`${secDatalist}
  <div class="card">
    <div class="form-2">
      ${field('Вкладка (категория)','tab',{type:'select',options:TABS})}
      ${field('Раздел','section',{ph:'напр. Салаты',list:'secs'})}
    </div>
    <div class="form-row" style="position:relative">
      <label class="fl">Название</label>
      <input type="text" data-k="name" id="nameInput" autocomplete="off" value="${_esc(sel().name)}" placeholder="Название блюда">
      <div class="sug" id="nameSug" hidden></div>
    </div>
    <div class="form-2">
      ${field('Подзаголовок','name2',{ph:'вторая строка курсивом / страна'})}
      ${field('Тип','type',{type:'select',options:['dish','pill']})}
    </div>
    <div class="form-2">
      ${field('Объём','vol',{ph:'250 г · 40 мл',hint:'слово «бутылка» уходит в подпись'})}
      ${field('Цена, ₽','price',{ph:'290 · или 149 / 550',hint:'только числа и «/»'})}
    </div>
    ${field('Описание / состав','desc',{type:'textarea',ph:'Помидоры, огурцы, листья романо'})}
    <div class="form-row"><label class="fl">Метки</label><div class="marks">${marks}</div></div>
    <div class="toolbar">
      <label class="switch"><button class="tgl ${it.hidden?'':'on'}" id="tglStop" aria-label="в наличии"></button>${it.hidden?'В стоп-листе':'В наличии'}</label>
      <span class="grow"></span>
      <button class="btn ghost" id="btnDup">Дублировать</button>
      <button class="btn danger" id="btnDel">Удалить</button>
    </div>
  </div>`;
  // тип select показывает dish/pill — переведём подписи
  const ts=$('#formWrap select[data-k="type"]');if(ts){ts.options[0].text='Блюдо';ts.options[1].text='Добавка';}
}
function showNameSug(q){
  const box=document.getElementById('nameSug');if(!box)return;
  q=(q||'').trim();
  if(!q){box.hidden=true;box.innerHTML='';return;}
  const cur=(sel()&&sel().name||'').toLowerCase();
  const opts=[...new Set([...SOST.map(s=>s.name),...items.map(x=>x.name)].filter(Boolean))];
  const fq=fz(q),lq=q.toLowerCase();
  const hit=opts.filter(n=>{const ln=n.toLowerCase();if(ln===cur)return false;
    if(ln.includes(lq))return true;
    return fq.length>=4&&subDist(fq,fz(n))<=1;})
    .sort((a,b)=>(a.toLowerCase().startsWith(lq)?0:1)-(b.toLowerCase().startsWith(lq)?0:1))
    .slice(0,8);
  if(!hit.length){box.hidden=true;box.innerHTML='';return;}
  box.innerHTML=hit.map(n=>`<div data-pick="${_esc(n)}">${_esc(n)}</div>`).join('');
  box.hidden=false;
}
function renderPreview(){
  const two=device==='desk';

  const body=sectionsOf(curTab).map(sc=>{
    const its=tabItems(curTab).filter(x=>x.section===sc && !x.hidden);
    return its.length?buildSection(sc,its):'';

  inner+=two?`<div class="tp-cols">${body}</div>`:body;
  pv.innerHTML=inner;
}

document.addEventListener('click',e=>{
  const kb=e.target.closest('[data-kb]');if(kb){openKbzhu(kb.getAttribute('data-kb'));return;}

    renderList();renderPreview();return;}

  const bstop=e.target.closest('[data-blstop]');if(bstop){const g=bstop.getAttribute('data-g'),i=+bstop.getAttribute('data-i');const o=BL.days[curDay][g][i];o.hidden=!o.hidden;blPersist();renderBLEditor();renderBLPreview();return;}

  const sg=e.target.closest('#seg button');if(sg){device=sg.getAttribute('data-d');

/* ── Перетаскивание порядка блюд ── */
const listEl=$('#list');
function afterEl(y){
  const els=[...listEl.querySelectorAll('.item:not(.dragging)')];
  let best={o:-Infinity,el:null};
  for(const el of els){const b=el.getBoundingClientRect();const o=y-b.top-b.height/2;
    if(o<0&&o>best.o)best={o,el};}
  return best.el;
}
listEl.addEventListener('dragstart',e=>{const it=e.target.closest('.item');if(!it)return;
  it.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',it.dataset.id);}catch(_){}});
listEl.addEventListener('dragover',e=>{e.preventDefault();const dragging=listEl.querySelector('.dragging');if(!dragging)return;
  const a=afterEl(e.clientY);if(a==null)listEl.appendChild(dragging);else listEl.insertBefore(dragging,a);});
listEl.addEventListener('drop',e=>e.preventDefault());
listEl.addEventListener('dragend',()=>{
  const dragging=listEl.querySelector('.dragging');if(dragging)dragging.classList.remove('dragging');
  // читаем новый порядок из DOM, определяя раздел по ближайшему заголовку сверху
  let curSec=null;const order=[];
  [...listEl.children].forEach(n=>{
    if(n.classList.contains('sec-h'))curSec=n.textContent.trim();
    else if(n.classList.contains('item')){const o=items.find(x=>x.id===n.dataset.id);
      if(o){if(curSec)o.section=curSec;order.push(o);}}
  });
  const byTab={};items.forEach(x=>{(byTab[x.tab]=byTab[x.tab]||[]).push(x);});
  byTab[curTab]=order;
  items=TABS.flatMap(t=>byTab[t]||[]);
  persist();renderList();renderForm();renderPreview();renderTabs();
});

/* ── Вход и синхронизация с Google-таблицей ── */
const API='https://script.google.com/macros/s/AKfycbxve4RtsGuDv89j8MiVp0g-1KCEKhqIZbrn52vpPUnkfhyfIHLsni-tkC1wd-Va5vw/exec';
let TOKEN=sessionStorage.getItem('tp_token')||'', USER=sessionStorage.getItem('tp_user')||'';
async function api(payload){
  let lastErr;
  for(let attempt=0;attempt<3;attempt++){
    try{
      const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
      const txt=await res.text();
      try{return JSON.parse(txt);}catch(_){ lastErr='stub'; } // Google отдал HTML-заглушку — повторим
    }catch(e){ lastErr=e; } // сетевой сбой — повторим
    await new Promise(r=>setTimeout(r,700*(attempt+1)));
  }
  throw new Error('Сервер не ответил ('+lastErr+')');
}
function showLogin(msg){document.getElementById('authov').classList.add('show');const el=document.getElementById('authErr');if(el)el.textContent=msg||'';}
function hideLogin(){document.getElementById('authov').classList.remove('show');}
function setUser(u){USER=u||'';const w=document.getElementById('who');if(w)w.textContent=u?('Вы вошли: '+u):'';}
async function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;
  if(!u||!p){showLogin('Введите логин и пароль');return;}
  const b=document.getElementById('loginBtn');b.disabled=true;b.textContent='Вход…';
  try{const r=await api({action:'login',user:u,pass:p});
    if(r&&r.ok){TOKEN=r.token;sessionStorage.setItem('tp_token',TOKEN);sessionStorage.setItem('tp_user',r.user);
      setUser(r.user);document.getElementById('loginPass').value='';hideLogin();await loadData();}
    else showLogin((r&&r.error)||'Ошибка входа');
  }catch(e){showLogin('Нет связи с сервером. Проверьте интернет.');}
  b.disabled=false;b.textContent='Войти';
}
function logout(){TOKEN='';sessionStorage.removeItem('tp_token');sessionStorage.removeItem('tp_user');setUser('');showLogin('');}
async function loadData(){
  try{const r=await api({action:'getData',token:TOKEN});
    if(!r||!r.ok){if(r&&r.auth){logout();showLogin('Сессия истекла — войдите снова');}else toast((r&&r.error)||'Ошибка загрузки');return;}
    const d=r.data||{};
    if(Array.isArray(d.menu)){items=d.menu.map((x,i)=>Object.assign({id:'d'+i},x));
      const t=[...new Set(items.map(x=>x.tab).filter(Boolean))];if(t.length)TABS=t;
      curTab=TABS[0];selId=(items.find(x=>x.tab===curTab)||items[0]||{}).id;persist();}
    if(Array.isArray(d.sost)){SOST=d.sost.map((x,i)=>Object.assign({id:'s'+i},x));soSel=(SOST[0]||{}).id;sostPersist();}
    if(d.lunch&&d.lunch.days){BL={price:d.lunch.price||'',days:d.lunch.days};
      WD.forEach(w=>{BL.days[w]=BL.days[w]||{salat:[],soup:[],main:[],side:[]};});blPersist();
      curDay=WD.includes(serverWD())?serverWD():'Понедельник';}
    setMode(curMode);toast('Данные загружены из таблицы');
  }catch(e){toast('Нет связи с сервером');}
}
async function saveData(kind){
  if(!TOKEN){showLogin('Войдите, чтобы сохранять');return;}
  toast(kind==='pub'?'Публикую…':'Сохраняю…');
  try{const r=await api({action:'saveData',token:TOKEN,data:{menu:items,lunch:BL,sost:SOST}});
    if(r&&r.ok)toast(kind==='pub'?'Готово — сайт обновится за пару минут':'Сохранено в таблицу');
    else if(r&&r.auth){logout();showLogin('Сессия истекла — войдите снова');}
    else toast((r&&r.error)||'Ошибка сохранения');
  }catch(e){toast('Нет связи с сервером');}
}

setUser(USER);
renderAll();
if(TOKEN) loadData(); else showLogin('');
</script>
